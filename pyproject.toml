[project]
name = "talotrace"
version = "0.1.0"
description = "Backend prototype: async AI chemistry explainer video request service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141.1",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "piper-tts>=1.8.0",
    "uvicorn>=0.54.0",
]

[tool.uv]
# This dev machine is an Intel Mac; newer onnxruntime (Piper's runtime) dropped x86_64 macOS wheels.
required-environments = ["sys_platform == 'darwin' and platform_machine == 'x86_64'"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: end-to-end tests that run Piper + ffmpeg (run with -m slow)"]
